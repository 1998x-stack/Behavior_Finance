name: content-integrity
on:
  pull_request:
  push:
    branches: [main, 'feat/s00-m01-content-integrity']
permissions:
  contents: read
jobs:
  content-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (isolated standard-library fixtures)
        run: python -m unittest discover -s tests -v
      - name: Read-only course inventory
        run: python main.py audit
